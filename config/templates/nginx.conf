# Replace dns.example.com and certificate paths. Include in nginx's http context.
server {
 listen 127.0.0.1:8544 ssl proxy_protocol;
 server_name dns.example.com *.dns.example.com;
 ssl_certificate /etc/smartdns/certs/fullchain.pem;
 ssl_certificate_key /etc/smartdns/certs/privkey.pem;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 access_log off;
 error_log /var/log/nginx/smartdns-error.log crit;
 client_max_body_size 64k;
 location /dns-query/ {
  proxy_pass http://127.0.0.1:3007;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Forwarded "";
  proxy_set_header Host $host;
 }
 location / {
  proxy_pass http://127.0.0.1:3008;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Forwarded "";
  proxy_set_header Host $host;
 }
}
