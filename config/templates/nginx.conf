# Replace dns.example.com and certificate paths. Include in nginx's http context.
server {
 listen 127.0.0.1:8544 ssl proxy_protocol;
 server_name dns.example.com *.dns.example.com;
 ssl_certificate /etc/smartdns/certs/current/fullchain.pem;
 ssl_certificate_key /etc/smartdns/certs/current/privkey.pem;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 access_log off;
 error_log /var/log/nginx/smartdns-error.log crit;
 client_max_body_size 64k;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:SmartDNS:4m;
 ssl_session_timeout 1h;
 client_header_timeout 10s;
 client_body_timeout 10s;
 keepalive_timeout 65s;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location /dns-query/ {
  proxy_pass http://127.0.0.1:3007;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 2s;
  proxy_read_timeout 12s;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Forwarded "";
  proxy_set_header Host $host;
 }
 location / {
  proxy_pass http://127.0.0.1:3008;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Forwarded "";
  proxy_set_header Host $host;
 }
}
