# Dedicated-host template. Merge with existing configuration on a shared server.
global
 user haproxy
 group haproxy
 stats socket /run/haproxy/smartdns-admin.sock mode 600 level admin
 maxconn 4096
defaults
 mode tcp
 timeout connect 5s
 timeout client 2m
 timeout server 2m
 timeout check 1s
frontend smartdns_tls
 bind :443
 tcp-request inspect-delay 5s
 tcp-request content set-var(sess.smartdns_sni) req.ssl_sni,lower if { req.ssl_hello_type 1 }
 tcp-request content accept if { req.ssl_hello_type 1 }
 acl own_name var(sess.smartdns_sni) -m str dns.example.com
 acl own_suffix var(sess.smartdns_sni) -m end .dns.example.com
 use_backend smartdns_web if own_name or own_suffix
 default_backend smartdns_origins
backend smartdns_web
 server web 127.0.0.1:8544 send-proxy-v2 maxconn 256
resolvers smartdns_public_dns
 nameserver cloudflare 1.1.1.1:53
 nameserver quad9 9.9.9.9:53
 resolve_retries 2
 timeout resolve 1s
 timeout retry 1s
 hold valid 60s
backend smartdns_origins
 tcp-request inspect-delay 5s
 tcp-request content reject unless { nbsrv(smartdns_agent_health) gt 0 }
 tcp-request content reject unless { src -f /etc/haproxy/smartdns-sources.acl }
 tcp-request content reject unless { var(sess.smartdns_sni) -m reg -f /etc/haproxy/smartdns-origins.acl }
 tcp-request content reject if { var(sess.smartdns_sni) -m str -f /etc/haproxy/smartdns-direct.acl }
 tcp-request content do-resolve(sess.target,smartdns_public_dns,ipv4) var(sess.smartdns_sni)
 tcp-request content reject unless { var(sess.target) -m found }
 acl forbidden var(sess.target) -m ip 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 203.0.113.10/32
 tcp-request content reject if forbidden
 tcp-request content set-dst var(sess.target)
 server origin 0.0.0.0:443 maxconn 256
backend smartdns_agent_health
 mode http
 option httpchk GET /health
 server agent 127.0.0.1:19108 check inter 1s fall 2 rise 1
