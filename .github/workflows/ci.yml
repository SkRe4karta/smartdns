name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/beta_checks.py backend
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: '.node-version', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/beta_checks.py integration
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: '.node-version'}
      - run: uv sync --locked
      - run: uv run --no-sync pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: python scripts/scan_secrets.py
  release-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version-file: '.node-version'}
      - run: uv sync --locked
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/build_release.py
      - run: python scripts/check_install.py dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: smartdns-candidate-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SBOM.cdx.json
          retention-days: 14

      - name: Attest main artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*.tar.gz
