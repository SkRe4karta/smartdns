name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/beta_checks.py backend
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: '.node-version', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/beta_checks.py integration
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: '.node-version'}
      - run: uv sync --locked
      - run: uv run --no-sync pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: python scripts/scan_secrets.py
  release-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: '.node-version'}
      - run: uv sync --locked
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/build_release.py
      - run: python scripts/check_install.py dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: smartdns-candidate-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SBOM.cdx.json
          retention-days: 14

      - name: Attest main artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*.tar.gz
  install:
    name: install-${{ matrix.version }}
    needs: release-check
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: true
      matrix:
        include:
          - version: '24.04'
            image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
          - version: '26.04'
            image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.13.6', python-version: '3.14.4'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: smartdns-candidate-${{ github.sha }}
          path: dist
      - name: Prepare disposable Ubuntu installation
        run: |
          mkdir -p "$RUNNER_TEMP/smartdns-tools"
          cp "$(command -v uv)" "$RUNNER_TEMP/smartdns-tools/uv"
          docker build --build-arg BASE='${{ matrix.image }}' -f tests/install/Dockerfile -t smartdns-install-test .
          docker run -d --name smartdns-install --privileged --cgroupns=host --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/smartdns-tools:/test-tools:ro" smartdns-install-test
      - name: Install and exercise real components
        run: docker exec -e SMARTDNS_DISPOSABLE_INSTALL_TEST=1 smartdns-install bash -lc 'python3 /workspace/tests/install/full_install.py /workspace/dist/*.tar.gz'
      - name: Installation diagnostics on failure
        if: failure()
        run: |
          docker exec smartdns-install systemctl --failed --no-pager || true
          docker exec smartdns-install journalctl -u smartdns-agent -u smartdns-api -u smartdns-gateway --no-pager -n 80 || true
      - name: Remove disposable container
        if: always()
        run: docker rm -f smartdns-install || true
